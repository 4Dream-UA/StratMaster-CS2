server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached without revalidating. It is the only
    # file whose name doesn't change between builds, and it is what points
    # at the content-hashed bundles below — which are deliberately immutable
    # for a year. Served with no Cache-Control at all (the previous
    # behaviour) a browser is free to apply heuristic freshness and reuse it
    # without asking, and Telegram's WebView does exactly that: the app then
    # keeps loading a months-old bundle no matter how many times the site is
    # redeployed, with no way for a player to force it. Revalidating costs a
    # 304 on an 800-byte file.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ^~ so this wins over the extension-based regex location below —
    # otherwise nginx matches uploaded *.jpg/*.png by extension first and
    # tries to serve them from the SPA's static root instead of proxying
    # to the backend, 404ing every uploaded image.
    location ^~ /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}