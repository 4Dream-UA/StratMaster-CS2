# Production nginx: TLS on 443, everything on 80 redirected except the ACME
# challenge. The dev/staging config (nginx.conf) stays plain HTTP because
# ngrok terminates TLS for it.
#
# Certificate paths assume the domain is stratmaster.fun. If that changes,
# both server_name lines and the two ssl_certificate paths change with it.

# Redirect http -> https, but keep the ACME webroot reachable: certbot
# renewal has to be able to answer on port 80 while the redirect is live.
server {
    listen 80;
    server_name stratmaster.fun www.stratmaster.fun;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www -> apex, so the app is served from exactly one origin. Telegram
# validates the Mini App URL, and two origins would mean two sets of
# localStorage and a second URL to keep configured everywhere.
server {
    listen 443 ssl;
    http2 on;
    server_name www.stratmaster.fun;

    ssl_certificate     /etc/letsencrypt/live/stratmaster.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stratmaster.fun/privkey.pem;

    return 301 https://stratmaster.fun$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name stratmaster.fun;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/stratmaster.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stratmaster.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # The app is only ever served over HTTPS from here on. Not preloaded —
    # that's a one-way commitment for the whole domain.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Telegram loads the Mini App inside an iframe, so framing can't be
    # denied outright — it's restricted to Telegram's own origins instead.
    add_header Content-Security-Policy "frame-ancestors https://web.telegram.org https://*.telegram.org" always;

    client_max_body_size 6m;  # a shade over the backend's 5 MB upload cap

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached without revalidating: it is the only
    # file whose name doesn't change between builds, and it is what points at
    # the content-hashed bundles below, which are immutable for a year. Served
    # without this a browser may reuse it heuristically — Telegram's WebView
    # does — and the app keeps loading a stale bundle after every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ^~ so this wins over the extension-based regex location below —
    # otherwise nginx matches uploaded *.jpg/*.png by extension first and
    # tries to serve them from the SPA's static root instead of proxying to
    # the backend, 404ing every uploaded image.
    location ^~ /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
